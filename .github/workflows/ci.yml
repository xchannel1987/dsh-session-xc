name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - run: npm ci
      
      - name: Verify lib files exist
        run: |
          test -f lib/index.js || (echo "lib/index.js not found" && exit 1)
          test -f lib/client.js || (echo "lib/client.js not found" && exit 1)
          echo "✅ All lib files present"
